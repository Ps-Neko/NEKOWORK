[package]
name = "harness-runtime"
version = "0.0.1"
edition = "2021"
description = "HARNESS Rust runtime — 영속 데몬, supervisor, IPC bridge"
license = "MIT"
publish = false

[[bin]]
name = "harness-runtime"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.32"
notify = "6.1"
ctrlc = "3.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true

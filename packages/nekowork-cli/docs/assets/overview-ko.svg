<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NEKOWORK AI 코드 안전 게이트</title>
  <desc id="desc">AI가 파일을 바꾸면 NEKOWORK가 위험을 검사하고, 쉬운 판정을 남긴 뒤, 사람이 프로젝트 반영 여부를 결정합니다.</desc>
  <defs>
    <filter id="cardShadow" x="-12%" y="-20%" width="124%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14213d" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f7f9fc; }
      .ink { fill: #14213d; }
      .muted { fill: #526174; }
      .card { fill: #ffffff; stroke: #d9e0ea; stroke-width: 2; filter: url(#cardShadow); }
      .label { font: 700 31px "Pretendard", "Noto Sans KR", "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
      .small { font: 500 22px "Pretendard", "Noto Sans KR", "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
      .title { font: 800 55px "Pretendard", "Noto Sans KR", "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
      .subtitle { font: 500 27px "Pretendard", "Noto Sans KR", "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
      .badge { font: 800 24px "Pretendard", "Noto Sans KR", "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
      .foot { font: 700 24px "Pretendard", "Noto Sans KR", "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
      .arrow { fill: none; stroke: #748197; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="630" rx="0"/>
  <rect x="48" y="42" width="1104" height="546" rx="8" fill="#ffffff" stroke="#d9e0ea" stroke-width="2"/>

  <text x="600" y="116" text-anchor="middle" class="title ink">AI 코드 안전 게이트</text>
  <text x="600" y="158" text-anchor="middle" class="subtitle muted">AI가 초안을 만들고, NEKOWORK가 위험을 확인하고, 사람이 결정합니다.</text>

  <g transform="translate(70 228)">
    <rect class="card" x="0" y="0" width="220" height="188" rx="8"/>
    <circle cx="110" cy="58" r="34" fill="#2f80ed"/>
    <path d="M95 57h30M110 42v30" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <text x="110" y="118" text-anchor="middle" class="label ink">1. AI 변경</text>
    <text x="110" y="151" text-anchor="middle" class="small muted">Cursor, Claude Code,</text>
    <text x="110" y="179" text-anchor="middle" class="small muted">Codex가 파일 수정</text>
  </g>

  <path class="arrow" d="M306 322h34"/>
  <path class="arrow" d="M320 302l22 20-22 20"/>

  <g transform="translate(350 228)">
    <rect class="card" x="0" y="0" width="220" height="188" rx="8"/>
    <circle cx="110" cy="58" r="34" fill="#f2c94c"/>
    <path d="M93 57l12 13 25-28" fill="none" stroke="#14213d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="118" text-anchor="middle" class="label ink">2. NEKOWORK</text>
    <text x="110" y="151" text-anchor="middle" class="small muted">바뀐 줄을 검사하고</text>
    <text x="110" y="179" text-anchor="middle" class="small muted">위험 패턴을 찾음</text>
  </g>

  <path class="arrow" d="M586 322h34"/>
  <path class="arrow" d="M600 302l22 20-22 20"/>

  <g transform="translate(630 228)">
    <rect class="card" x="0" y="0" width="220" height="188" rx="8"/>
    <circle cx="110" cy="58" r="34" fill="#27ae60"/>
    <text x="110" y="68" text-anchor="middle" class="badge" fill="#ffffff">통과</text>
    <text x="110" y="118" text-anchor="middle" class="label ink">3. 쉬운 판정</text>
    <text x="110" y="151" text-anchor="middle" class="small muted">통과, 검토 필요,</text>
    <text x="110" y="179" text-anchor="middle" class="small muted">또는 차단</text>
  </g>

  <path class="arrow" d="M866 322h34"/>
  <path class="arrow" d="M880 302l22 20-22 20"/>

  <g transform="translate(910 228)">
    <rect class="card" x="0" y="0" width="220" height="188" rx="8"/>
    <circle cx="110" cy="58" r="34" fill="#eb5757"/>
    <path d="M96 61l10 10 24-28" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="118" text-anchor="middle" class="label ink">4. 사람 결정</text>
    <text x="110" y="151" text-anchor="middle" class="small muted">안전할 때만</text>
    <text x="110" y="179" text-anchor="middle" class="small muted">프로젝트에 반영</text>
  </g>

  <rect x="86" y="456" width="1028" height="74" rx="8" fill="#14213d"/>
  <text x="600" y="502" text-anchor="middle" class="foot" fill="#ffffff">내 컴퓨터에서 실행 • 증거 리포트 저장 • 자동 커밋, push, 배포 없음</text>

  <text x="600" y="570" text-anchor="middle" class="small muted">AI 도구를 먼저 사용하고, 변경을 받아들이기 전에 NEKOWORK를 실행하세요.</text>
</svg>

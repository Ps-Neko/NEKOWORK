name: 'NEKOWORK verify-pr'
description: 'Run @ps-neko/nekowork verify-pr to gate AI-written diffs deterministically before they hit main.'
author: 'Ps-Neko'
branding:
  icon: 'shield'
  color: 'gray-dark'

inputs:
  args:
    description: 'Extra args passed to `nekowork verify-pr`. Example: --from-staged --comment-file pr-comment.md'
    required: false
    default: ''
  node-version:
    description: 'Node.js major version to install. Must be 22+.'
    required: false
    default: '22'
  version:
    description: 'Pin the @ps-neko/nekowork package version (e.g. 0.1.0-alpha.11). Defaults to latest published alpha.'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run nekowork verify-pr
      shell: bash
      env:
        # Pass caller inputs through env vars, NOT ${{ }} templates inside run:.
        # Templating untrusted input directly into the run script is the classic
        # GitHub Actions script-injection vector; env-var indirection prevents it.
        # NEKO_ARGS is word-split intentionally so multiple flags work correctly.
        # Do not invoke this Action from untrusted PR contexts with attacker-
        # controlled args.
        NEKO_ARGS: ${{ inputs.args }}
        NEKO_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        npx -y "@ps-neko/nekowork@${NEKO_VERSION}" verify-pr ${NEKO_ARGS}

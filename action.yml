name: 'NEKOWORK verify-pr'
description: 'Run @ps-neko/nekowork verify-pr to gate AI-written diffs deterministically before they hit main.'
author: 'Ps-Neko'
branding:
  icon: 'shield'
  color: 'gray-dark'

inputs:
  args:
    description: 'Extra args passed to `nekowork verify-pr`. Example: --from-staged --comment-file pr-comment.md'
    required: false
    default: ''
  node-version:
    description: 'Node.js major version to install. Must be 22+.'
    required: false
    default: '22'
  version:
    description: 'Pin the @ps-neko/nekowork package version or dist-tag (e.g. 0.2.0-alpha.10). Defaults to the alpha dist-tag — not `latest`, which is pinned to a stale 0.2.0-alpha.0.'
    required: false
    default: 'alpha'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run nekowork verify-pr
      shell: bash
      env:
        # Pass caller inputs through env vars, NOT ${{ }} templates inside run:.
        # Templating untrusted input directly into the run script is the classic
        # GitHub Actions script-injection vector; env-var indirection prevents it.
        # `args` is still TRUSTED config: the array expansion below stops glob /
        # word-split surprises, but it cannot stop argument injection — do not
        # wire attacker-controlled values into `args`.
        NEKO_ARGS: ${{ inputs.args }}
        NEKO_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # Split NEKO_ARGS on whitespace into an array, then expand each element as
        # a separate, individually-quoted argument. Multiple flags still work
        # (e.g. "--from-staged --comment-file pr-comment.md"), but unlike a bare
        # unquoted ${NEKO_ARGS} this does NOT glob-expand the args (`*` stays
        # literal) and has no word-splitting surprises. `read` returns non-zero at
        # the trailing EOF, harmless under `set -e` (hence `|| true`); an empty
        # NEKO_ARGS yields an empty array → no extra args.
        read -ra NEKO_ARGS_ARR <<< "${NEKO_ARGS}" || true
        npx -y "@ps-neko/nekowork@${NEKO_VERSION}" verify-pr "${NEKO_ARGS_ARR[@]}"

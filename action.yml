name: 'NEKOWORK verify-pr'
description: 'Run @ps-neko/nekowork verify-pr to gate AI-written diffs deterministically before they hit main.'
author: 'Ps-Neko'
branding:
  icon: 'shield'
  color: 'gray-dark'

inputs:
  args:
    description: 'Extra args passed to `nekowork verify-pr`. Example: --from-staged --comment-file pr-comment.md'
    required: false
    default: ''
  node-version:
    description: 'Node.js major version to install. Must be 22+.'
    required: false
    default: '22'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run nekowork verify-pr
      shell: bash
      env:
        NEKO_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        # NEKO_ARGS is intentionally unquoted so callers can pass multiple flags.
        # Callers control their own workflow YAML, so the value is trusted in the
        # standard case. Avoid triggering this Action from untrusted PR contexts.
        # shellcheck disable=SC2086
        npx -y @ps-neko/nekowork verify-pr ${NEKO_ARGS}

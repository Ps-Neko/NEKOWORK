name: visualizer-deploy

# D10 + D11 lock (2026-05-23 plan):
#   - main 푸시만 trigger (PR preview 안 함, GitHub Pages quota 보존).
#   - concurrency: pages cancel-in-progress.
#   - actions/deploy-pages@v4 표준.

on:
  push:
    branches: [main]
    paths:
      - 'packages/nekowork-cli/docs/visualizer/**'
      - '.github/workflows/visualizer-deploy.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build visualizer
        run: pnpm --filter @ps-neko/visualizer build

      - name: Configure Pages (auto-enable if not yet activated)
        uses: actions/configure-pages@v5
        with:
          # NOTE: 첫 deploy 시 repo settings 의 Pages 가 비활성 상태면 자동 활성화 시도.
          # GITHUB_TOKEN 의 pages:write permission 으로 enable API 호출.
          # 사용자가 repo settings → Pages → "Build and deployment: GitHub Actions"
          # 으로 수동 설정해도 동일.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/nekowork-cli/docs/visualizer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  lighthouse:
    # T9 — D9 lock: FCP < 1.5s hard block (3 run mean).
    # deploy 직후 live Pages URL 에 lighthouse autorun.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Wait for Pages to settle (avoid 1st-request edge cache miss)
        run: sleep 30

      - name: Lighthouse CI (FCP < 1.5s, 3 run mean)
        run: |
          set -euo pipefail
          URL="${{ needs.deploy.outputs.page_url }}?fixture=sample-pr-001"
          echo "Auditing: ${URL}"
          npx -y @lhci/cli@0.14 autorun \
            --config=packages/nekowork-cli/docs/visualizer/lighthouserc.json \
            --collect.url="${URL}"

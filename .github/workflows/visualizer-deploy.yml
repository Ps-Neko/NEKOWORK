name: visualizer-deploy

# D10 + D11 lock (2026-05-23 plan):
#   - main 푸시만 trigger (PR preview 안 함, GitHub Pages quota 보존).
#   - concurrency: pages cancel-in-progress.
#   - actions/deploy-pages@v4 표준.

on:
  push:
    branches: [main]
    paths:
      - 'packages/nekowork-cli/docs/visualizer/**'
      - '.github/workflows/visualizer-deploy.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build visualizer
        run: pnpm --filter @ps-neko/visualizer build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/nekowork-cli/docs/visualizer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

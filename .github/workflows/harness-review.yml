name: harness-review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      task:
        description: Review task description
        required: false
        default: ''
      secure:
        description: Force stage 6 codex-challenge
        required: false
        default: auto
        type: choice
        options: [auto, on, off]
      live:
        description: Use live LLM runner. Only honored for manual workflow_dispatch.
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: harness-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      HARNESS_HOOK_GATEGUARD: '1'
      HARNESS_HOOK_QUALITY_GATE: '1'
      HARNESS_HOOK_PRE_BASH: '0'
      HARNESS_HOOK_PERSISTENT_MODE: '0'
      HARNESS_CI_SESSION_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate catalog
        run: |
          node packages/nekowork-cli/scripts/install-plan.js --profile core --verbose
          node packages/nekowork-cli/scripts/ci/catalog.js
          node packages/nekowork-cli/scripts/ci/check-markers.js

      - name: Security hardening gate
        run: pnpm --filter @ps-neko/nekowork-harness run security:hardening

      - name: Compute task / secure / live
        id: opts
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TASK: ${{ github.event.inputs.task || '' }}
          INPUT_SECURE: ${{ github.event.inputs.secure || 'auto' }}
          INPUT_LIVE: ${{ github.event.inputs.live || 'false' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          TASK="$INPUT_TASK"
          if [ -z "$TASK" ] && [ -n "$PR_TITLE" ]; then
            TASK="$PR_TITLE"
          fi
          if [ -z "$TASK" ]; then
            TASK="auto: $EVENT_NAME $GITHUB_REF"
          fi
          echo "task=$TASK" >> "$GITHUB_OUTPUT"

          SECURE_FLAG=""
          if [ "$INPUT_SECURE" = "on" ]; then
            SECURE_FLAG="--secure"
          fi
          echo "secure_flag=$SECURE_FLAG" >> "$GITHUB_OUTPUT"

          LIVE_FLAG=""
          RUNNER=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_LIVE" = "true" ] && [ "$HAS_ANTHROPIC_API_KEY" = "true" ]; then
            LIVE_FLAG="--live"
            RUNNER="sdk"
          fi
          echo "live_flag=$LIVE_FLAG" >> "$GITHUB_OUTPUT"
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"

      - name: Run review
        id: review
        env:
          TASK: ${{ steps.opts.outputs.task }}
          SECURE_FLAG: ${{ steps.opts.outputs.secure_flag }}
          LIVE_FLAG: ${{ steps.opts.outputs.live_flag }}
          ANTHROPIC_API_KEY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.live == 'true' && secrets.ANTHROPIC_API_KEY || '' }}
          HARNESS_CLAUDE_RUNNER: ${{ steps.opts.outputs.runner }}
        run: |
          set +e
          node packages/nekowork-cli/scripts/cli.js review "$TASK" \
            $SECURE_FLAG \
            $LIVE_FLAG \
            --no-ship \
            --session "$HARNESS_CI_SESSION_ID"
          CODE=$?
          echo "exit=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "0" ]; then
            echo "verdict=approve" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" = "3" ]; then
            echo "verdict=human_gate" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=error" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Collect handoffs
        if: always()
        run: |
          SESSION_DIR=".harness/state/sessions/$HARNESS_CI_SESSION_ID"
          if [ -d "$SESSION_DIR/handoffs" ]; then
            echo "## Handoffs"
            ls "$SESSION_DIR/handoffs"
            echo ""
            for f in "$SESSION_DIR"/handoffs/*.md; do
              echo "----"
              cat "$f"
            done > /tmp/handoffs.md
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: harness-handoffs-${{ env.HARNESS_CI_SESSION_ID }}
          path: .harness/state/sessions/${{ env.HARNESS_CI_SESSION_ID }}/
          retention-days: 14

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const sessionId = process.env.HARNESS_CI_SESSION_ID;
            const sessionDir = `.harness/state/sessions/${sessionId}`;
            let body = `### HARNESS review (${{ steps.review.outputs.verdict }})\n\n`;
            body += `session: \`${sessionId}\`\n`;
            body += `exit: \`${{ steps.review.outputs.exit }}\`\n\n`;
            try {
              const handoffs = fs.readdirSync(`${sessionDir}/handoffs`).filter(f => f.endsWith('.md')).sort();
              body += `handoffs: ${handoffs.length}\n`;
              for (const f of handoffs) body += `- \`${f}\`\n`;
              const last = handoffs.filter(f => f.includes('codex-review') || f.includes('codex-challenge')).pop();
              if (last) {
                const text = fs.readFileSync(`${sessionDir}/handoffs/${last}`, 'utf8');
                body += `\n<details><summary>${last}</summary>\n\n${text}\n</details>\n`;
              }
            } catch (e) {
              body += `(handoff directory missing: ${e.message})\n`;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail on human gate / error
        if: steps.review.outputs.verdict != 'approve'
        run: |
          echo "review verdict: ${{ steps.review.outputs.verdict }}"
          exit 1

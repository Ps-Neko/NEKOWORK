name: harness-validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  published-alpha-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Fresh npx alpha check smoke
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/nekowork-alpha-smoke"
          mkdir -p "$workdir"
          cd "$workdir"
          npx -y @ps-neko/nekowork@alpha check --json > check.json
          node <<'NODE'
          const { execSync } = require('node:child_process');
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('check.json', 'utf8'));
          const expectedVersion = JSON.parse(execSync('npm view @ps-neko/nekowork@alpha version --json', { encoding: 'utf8' }));
          const metadata = report.checks.find((check) => check.name === 'package metadata');
          if (report.summary.fail !== 0) {
            throw new Error(`check reported ${report.summary.fail} failure(s)`);
          }
          if (!metadata || !metadata.message.includes(`@ps-neko/nekowork@${expectedVersion}`)) {
            throw new Error(`unexpected package metadata: ${metadata?.message || '<missing>'}`);
          }
          console.log(`published alpha smoke: ${metadata.message}`);
          NODE

      - name: Fresh npx alpha init smoke
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/nekowork-alpha-init-smoke"
          mkdir -p "$workdir"
          cd "$workdir"
          git init -q
          expected_version="$(npm view @ps-neko/nekowork@alpha version --json | node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8'))")"
          npx -y @ps-neko/nekowork@alpha init --profile developer --project-root . --dry-run > init.txt
          if ! grep -Fq "HARNESS install --plan  (v${expected_version})" init.txt; then
            echo "expected init plan version: v${expected_version}"
            cat init.txt
            exit 1
          fi
          echo "published alpha init smoke: v${expected_version}"

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cli:
              - 'packages/nekowork-cli/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/harness-validate.yml'

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Security hardening gate
        run: pnpm --filter @ps-neko/nekowork run security:hardening

      - name: Dependency audit
        run: pnpm audit --audit-level=moderate

  validate-cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    # timeout-minutes: 20 — security-hardening 의 dead-man max 20 룰 준수.
    # visualizer step (playwright install + gen-hero-gif + a11y + lighthouse) 가
    # 5분 단축 필요시 step optimize 또는 dead-man max 룰 갱신 (별도 결정).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r run build

      - name: Validate manifests and catalog
        run: |
          node packages/nekowork-cli/scripts/install-plan.js --profile core --verbose
          node packages/nekowork-cli/scripts/install-plan.js --profile developer
          node packages/nekowork-cli/scripts/install-plan.js --profile security
          node packages/nekowork-cli/scripts/install-plan.js --profile research
          node packages/nekowork-cli/scripts/install-plan.js --profile full
          node packages/nekowork-cli/scripts/ci/catalog.js
          node packages/nekowork-cli/scripts/ci/check-markers.js

      - name: nekowork-cli tests
        run: pnpm --filter @ps-neko/nekowork run test

      - name: Build projections
        run: |
          node packages/nekowork-cli/scripts/build-claude.js
          node packages/nekowork-cli/scripts/build-codex.js
          node packages/nekowork-cli/scripts/build-cursor.js
          node packages/nekowork-cli/scripts/build-gemini.js
          node packages/nekowork-cli/scripts/build-opencode.js

      # ---- Phase 1.0 visualizer hardening (T8, T10, T11) ----

      - name: Install system deps (ffmpeg + Korean fonts for hero GIF)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk ffmpeg

      - name: Install Playwright browsers
        run: pnpm --filter @ps-neko/visualizer exec playwright install --with-deps chromium

      - name: Visualizer bundle size assertion (D9 — gzip < 100KB)
        run: |
          set -euo pipefail
          DIR=packages/nekowork-cli/docs/visualizer/dist/assets
          JS_FILE=$(find "$DIR" -name "index-*.js" -not -name "*.map" | head -1)
          CSS_FILE=$(find "$DIR" -name "index-*.css" | head -1 || true)
          if [ -z "$JS_FILE" ]; then
            echo "::error::visualizer JS bundle missing in $DIR (did pnpm -r run build succeed?)"
            exit 1
          fi
          JS_GZIP=$(gzip -9 -c "$JS_FILE" | wc -c)
          CSS_GZIP=0
          if [ -n "$CSS_FILE" ]; then
            CSS_GZIP=$(gzip -9 -c "$CSS_FILE" | wc -c)
          fi
          TOTAL=$((JS_GZIP + CSS_GZIP))
          MAX=102400
          echo "JS gzip:    ${JS_GZIP} bytes"
          echo "CSS gzip:   ${CSS_GZIP} bytes"
          echo "TOTAL gzip: ${TOTAL} bytes (max ${MAX} = 100KB)"
          if [ "$TOTAL" -gt "$MAX" ]; then
            echo "::error::visualizer bundle gzip ${TOTAL} exceeds 100KB"
            exit 1
          fi

      - name: Generate hero GIF (T5 → T8)
        run: pnpm --filter @ps-neko/visualizer run gen-hero-gif

      - name: Hero GIF size assertion (D9 — < 5MB)
        run: |
          set -euo pipefail
          GIF=packages/nekowork-cli/docs/assets/hero.gif
          if [ ! -f "$GIF" ]; then
            echo "::error::hero.gif not generated at ${GIF}"
            exit 1
          fi
          SIZE=$(stat -c%s "$GIF")
          MAX=5242880
          echo "hero.gif: ${SIZE} bytes (max ${MAX} = 5MB)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::hero.gif ${SIZE} exceeds 5MB"
            exit 1
          fi

      - name: Visualizer a11y test (T11)
        run: pnpm --filter @ps-neko/visualizer run test:a11y

      - name: Upload hero GIF artifact (PR review aid)
        if: always() && hashFiles('packages/nekowork-cli/docs/assets/hero.gif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hero-gif
          path: packages/nekowork-cli/docs/assets/hero.gif
          retention-days: 30

  tarball-size-guard:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: npm pack dry-run (capture tarball metadata)
        working-directory: packages/nekowork-cli
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          jq -r '.[0] | "size=\(.size) unpackedSize=\(.unpackedSize)"' /tmp/pack.json

      - name: Tarball size delta assertion (< 1MB vs alpha.11 baseline)
        run: |
          set -euo pipefail
          ALPHA11_SIZE=$(npm view @ps-neko/nekowork@0.1.0-alpha.11 dist.unpackedSize)
          CURRENT_SIZE=$(jq -r '.[0].unpackedSize' /tmp/pack.json)
          DELTA=$((CURRENT_SIZE - ALPHA11_SIZE))
          MAX_DELTA=1048576
          echo "alpha.11 baseline:    ${ALPHA11_SIZE} bytes"
          echo "current pack:         ${CURRENT_SIZE} bytes"
          echo "delta:                ${DELTA} bytes (max ${MAX_DELTA})"
          if [ "$DELTA" -gt "$MAX_DELTA" ]; then
            echo "::error::npm pack delta ${DELTA} exceeds ${MAX_DELTA} (1MB)"
            exit 1
          fi
          echo "OK npm pack delta within 1MB"

      - name: Visualizer absence check (.npmignore working)
        working-directory: packages/nekowork-cli
        run: |
          set -euo pipefail
          LEAKED=$(jq -r '.[0].files[] | select(.path | startswith("docs/visualizer")) | .path' /tmp/pack.json || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::docs/visualizer/ leaked into npm tarball — check packages/nekowork-cli/.npmignore"
            echo ""
            echo "=== Leaked paths (top 20) ==="
            echo "$LEAKED" | head -20
            echo ""
            echo "=== .npmignore content ==="
            cat .npmignore || echo "(missing!)"
            echo ""
            echo "=== ls -la docs/ ==="
            ls -la docs/ | head -10
            exit 1
          fi
          echo "OK docs/visualizer/ excluded from tarball"

  validate-all:
    needs: [security, validate-cli, tarball-size-guard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate verdict
        env:
          R_SECURITY: ${{ needs.security.result }}
          R_CLI: ${{ needs.validate-cli.result }}
          R_TARBALL: ${{ needs.tarball-size-guard.result }}
        run: |
          set -euo pipefail
          fail=0
          for k in security cli tarball; do
            upper="$(echo "$k" | tr '[:lower:]' '[:upper:]')"
            var="R_${upper}"
            result="${!var}"
            case "$result" in
              success|skipped)
                echo "$k: $result"
                ;;
              *)
                echo "::error::$k = $result"
                fail=1
                ;;
            esac
          done
          if [ "$fail" = "1" ]; then
            echo "::error::one or more required jobs failed"
            exit 1
          fi
          echo "all required jobs satisfied (success or skipped)"

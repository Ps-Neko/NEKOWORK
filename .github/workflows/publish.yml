name: publish

# CRITICAL: workflow_dispatch ONLY — this workflow must NEVER auto-fire.
# No push:/pull_request:/schedule: triggers allowed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag to publish under (e.g. alpha, latest)'
        required: false
        default: 'alpha'

# Least-privilege permissions.
# id-token: write  — required for npm provenance (OIDC attestation).
# contents: read   — checkout only.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js (>=22, npm registry auth)
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Validation gates — must pass before publishing.
      - name: nekowork slim tests
        run: pnpm --filter @ps-neko/nekowork run test

      - name: nekowork bench:rules
        run: pnpm --filter @ps-neko/nekowork run bench:rules

      # Publish the SLIM package only (packages/nekowork) via OIDC Trusted Publishing.
      # NO NPM_TOKEN / no long-lived token: GitHub's short-lived OIDC id-token
      # authenticates to npm. Requires a Trusted Publisher configured on npmjs.com
      # for repo Ps-Neko/NEKOWORK + workflow `publish.yml`, and npm >= 11.5.1
      # (upgraded below). --provenance attaches a signed build attestation;
      # --access public for the scoped package on first publish.
      - name: Publish @ps-neko/nekowork (OIDC trusted publishing, no token)
        working-directory: packages/nekowork
        env:
          PUBLISH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          npm install -g npm@latest   # ensure OIDC trusted-publishing support (npm >= 11.5.1)
          npm publish --provenance --tag "${PUBLISH_TAG}" --access public

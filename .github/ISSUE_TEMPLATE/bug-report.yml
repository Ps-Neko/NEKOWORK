name: Bug report
description: Report a reproducible NEKOWORK bug.
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include a minimal reproduction and redact secrets, private paths, and proprietary code.
  - type: input
    id: version
    attributes:
      label: NEKOWORK version
      placeholder: "@ps-neko/nekowork@0.1.0-alpha.2 or git commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, shell, node -v, npm -v"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. See ...
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      render: text
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: Critical means a safety invariant may have been bypassed.
      options:
        - install path blocked
        - report or evidence incorrect
        - provider auth confusion
        - platform-specific failure
        - safety invariant concern
        - other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste redacted logs, `doctor --quick --json`, or report summaries.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, credentials, private paths, and proprietary source code from pasted output.
          required: true

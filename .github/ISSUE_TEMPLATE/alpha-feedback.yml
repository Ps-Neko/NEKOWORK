name: Alpha feedback
description: Share first-run feedback, doctor output, or report evidence from the public alpha.
title: "[alpha feedback]: "
labels:
  - alpha-feedback
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying NEKOWORK. Please remove secrets, private paths, and proprietary code before pasting output.
        The most useful alpha evidence is `check --json` plus a short `REPORT.md` summary.
  - type: dropdown
    id: install_path
    attributes:
      label: Install path
      options:
        - npx @ps-neko/nekowork@alpha
        - npm dev dependency
        - global npm install
        - git clone
        - submodule or local checkout
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and shell
      placeholder: "Windows 11 / PowerShell, macOS / zsh, Ubuntu / bash"
    validations:
      required: true
  - type: input
    id: node_npm
    attributes:
      label: Node and npm
      placeholder: "node v22.x, npm 10.x"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: Paste the exact command, for example `npx -y @ps-neko/nekowork@alpha check`.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: feedback_class
    attributes:
      label: Feedback class
      description: Pick the closest category. Maintainers may adjust during triage.
      options:
        - install failure
        - auth confusion
        - evidence/report confusion
        - safety concern
        - platform mismatch
        - product request
        - other
    validations:
      required: true
  - type: dropdown
    id: severity_guess
    attributes:
      label: Severity guess
      description: Critical means a safety invariant may have been bypassed.
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: false
  - type: textarea
    id: doctor_json
    attributes:
      label: check --json output
      description: Run `npx -y @ps-neko/nekowork@alpha check --json` and paste the redacted output.
      render: json
    validations:
      required: false
  - type: textarea
    id: report_summary
    attributes:
      label: REPORT.md summary
      description: Paste only the summary lines, not proprietary source code.
      placeholder: |
        Status:
        Verdict:
        Ship ready:
        Human gate:
        Applied:
        Evidence:
      render: markdown
    validations:
      required: false
  - type: textarea
    id: what_worked
    attributes:
      label: What worked?
      description: Tell us what felt clear, useful, or trustworthy.
    validations:
      required: false
  - type: textarea
    id: what_blocked
    attributes:
      label: What blocked or confused you?
      description: Include error messages, unclear docs, or missing expectations.
    validations:
      required: false
  - type: textarea
    id: target_status
    attributes:
      label: Target project status
      description: For ship/apply concerns, paste redacted `git status --short` and whether `apply` was requested.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, credentials, private paths, and proprietary source code from pasted output.
          required: true
